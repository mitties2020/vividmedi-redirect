<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CareQuay — Temporarily offline</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f8;
      color: #17323b;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      padding: 40px;
      border: 1px solid #d8e2e5;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 14px 36px rgba(23, 50, 59, 0.08);
      text-align: center;
    }

    .mark {
      display: inline-grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin-bottom: 18px;
      border-radius: 13px;
      background: #0b6f73;
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(26px, 6vw, 36px);
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: #526a72;
      font-size: 17px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CQ</div>
    <h1>CareQuay is temporarily offline</h1>
    <p>This demonstration is not currently available. Please check back later.</p>
  </main>
</body>
</html>
